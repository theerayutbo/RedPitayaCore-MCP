name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    env:
      RP_MODE: mock
      RP_ALLOW_RX: 'false'
      RP_ALLOW_LIFECYCLE: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '0.11.6'
          enable-cache: false
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen --extra dev pytest -q
      - run: uv run --frozen --extra dev ruff check src tests
      - run: uv run --frozen --extra dev ruff format --check src tests
      - run: uv run --frozen --extra dev mypy src
      - run: uv run --frozen --extra dev bandit -q -r src
      - run: uv build

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '0.11.6'
          enable-cache: false
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen --extra dev pip-audit --progress-spinner off
